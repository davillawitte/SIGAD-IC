name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Os projetos de teste sobem o proprio Postgres via Testcontainers, usando o
    # Docker que ja existe no runner. Nao ha servico de banco compartilhado.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@davillawitte"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore frontend dependencies
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Restore backend
        working-directory: backend
        run: dotnet restore TemplateSistema.sln

      - name: Build backend
        working-directory: backend
        run: dotnet build TemplateSistema.sln --no-restore -c Release

      - name: Test backend
        working-directory: backend
        run: dotnet test TemplateSistema.sln --no-build -c Release --verbosity normal
