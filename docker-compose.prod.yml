# Produção — acesso único via nginx em http://<HOST>/ (porta 80).
# Uso:
#   cp .env.prod.example .env.prod   # preencha DB_PASSWORD, JWT_KEY, NODE_AUTH_TOKEN
#   ./scripts/docker-up-prod.sh
#
# Postgres e API NÃO são publicados no host (só rede interna Docker).

services:
  postgres:
    image: postgres:17-alpine
    container_name: sigad-ic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em .env.prod}
      POSTGRES_DB: ${DB_NAME:-gestao_ic}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sigad-ic

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sigad-ic-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-gestao_ic};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-sigad-ic}
      Jwt__Audience: ${JWT_AUDIENCE:-sigad-ic-frontend}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY (>=32 caracteres) em .env.prod}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-480}
      Cors__Origins__0: ${APP_ORIGIN:-http://10.9.233.98}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigad-ic

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:?Defina NODE_AUTH_TOKEN em .env.prod}
    container_name: sigad-ic-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - sigad-ic

volumes:
  postgres_data_prod:

networks:
  sigad-ic:
    name: sigad-ic
