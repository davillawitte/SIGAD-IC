services:
  postgres:
    image: postgres:17-alpine
    container_name: template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestao_ic_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_ic_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: template-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=gestao_ic_dev;Username=postgres;Password=postgres"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN}
    container_name: template-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
