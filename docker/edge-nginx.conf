# Nginx de borda — etapa atual (sem DNS/TLS):
#   Host :8080 → SIGAD-IC
#   Host :80   → permanece com gestao-SCFA (não alteramos o SCFA)
#
# Quando o SCFA deixar de publicar a porta 80 no host, acrescente um
# server { listen 80 default_server; ... } apontando para o client do SCFA
# na rede `edge`, e (depois) listen 443 ssl.

upstream sigad_frontend {
    server sigad-ic-frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://sigad_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
