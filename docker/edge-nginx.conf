# Nginx de borda — etapa atual (sem DNS/TLS):
#   Host :8080 → SIGAD-IC
#   Host :80   → permanece com gestao-SCFA (não alteramos o SCFA)
#
# Quando o SCFA deixar de publicar a porta 80 no host, acrescente um
# server { listen 80 default_server; ... } apontando para o client do SCFA
# na rede `edge`, e (depois) listen 443 ssl.

# Rate limit de login/setup por IP real do cliente — só a borda vê esse IP; o nginx do
# frontend e a API, atrás dela, só enxergam o IP do container edge-nginx.
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=5r/m;

upstream sigad_frontend {
    server sigad-ic-frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # /setup é anônimo por natureza (wizard de provisionamento do superadministrador) — a
    # trava aqui é rede institucional + rate limit, somada ao token de uso único validado
    # pela API. Ajuste a faixa abaixo para a rede real (hoje documentada como
    # 10.9.233.0/24 — ver docs/deploy-prod.md, seção "Provisionamento do superadministrador").
    location /api/setup/ {
        allow 10.9.233.0/24;
        allow 127.0.0.1;
        deny all;

        limit_req zone=auth_rl burst=5 nodelay;

        proxy_pass http://sigad_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location /api/auth/login {
        limit_req zone=auth_rl burst=5 nodelay;

        proxy_pass http://sigad_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://sigad_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
