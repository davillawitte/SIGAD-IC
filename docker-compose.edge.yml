# Nginx de borda — único dono público da porta do SIGAD (padrão 8080).
# A porta 80 do host fica com o gestao-SCFA; este stack NÃO a ocupa.
#
# Pré-requisito: rede Docker externa `edge` (criada pelo docker-up-prod.sh).
# Uso: sobe junto com ./scripts/docker-up-prod.sh

name: edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge:
    external: true
    name: edge
