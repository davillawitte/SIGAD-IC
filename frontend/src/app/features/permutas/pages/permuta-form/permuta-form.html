<pci-form-page
  title="Nova permuta"
  description="Selecione os servidores e os dias da escala que serão permutados."
  currentPath="/permutas/nova"
  [routePages]="routePages"
  saveLabel="Salvar permuta"
  [loading]="saving()"
  (cancelClicked)="cancel()"
  (saveClicked)="save()"
>
  @if (error()) {
    <pci-alert variant="error" title="Erro" [message]="error()!" />
  }

  <form [formGroup]="form" class="permuta-form">
    <div class="permuta-form__grid">
      <section class="permuta-lado" aria-label="Solicitante">
        <header class="permuta-lado__header">
          <span class="permuta-lado__avatar" aria-hidden="true"><pci-icon name="user" size="md" /></span>
          <h3 class="permuta-lado__titulo">Solicitante</h3>
        </header>
        <div class="permuta-lado__campos">
          <pci-select
            class="permuta-lado__servidor"
            label="Servidor solicitante"
            [required]="true"
            formControlName="solicitanteServidorId"
            [options]="solicitanteOptions()"
            placeholder="Selecione o solicitante"
          />
          <pci-datepicker class="permuta-lado__data" label="Data" formControlName="dataIda" [required]="true" />
        </div>
        <app-permuta-dias
          titulo="Escala do solicitante"
          [ano]="lados.solicitante().ano"
          [mes]="lados.solicitante().mes"
          [escala]="lados.solicitante().escala"
          [loading]="lados.solicitante().loading"
          [semServidor]="!solicitanteId()"
          [selecionada]="dataIda()"
          (diaClicado)="onDia('solicitante', $event)"
          (mesAlterado)="onMes('solicitante', $event)"
        />
      </section>

      <div class="permuta-form__troca" aria-hidden="true">
        <span class="permuta-form__setas">
          <pci-icon name="arrow-right" size="md" />
          <pci-icon name="arrow-left" size="md" />
        </span>
      </div>

      <section class="permuta-lado" aria-label="Permutante">
        <header class="permuta-lado__header">
          <span class="permuta-lado__avatar permuta-lado__avatar--permutante" aria-hidden="true">
            <pci-icon name="user" size="md" />
          </span>
          <h3 class="permuta-lado__titulo">Permutante</h3>
        </header>
        <div class="permuta-lado__campos">
          <pci-select
            class="permuta-lado__servidor"
            label="Servidor permutante"
            [required]="true"
            formControlName="permutanteServidorId"
            [options]="permutanteOptions()"
            placeholder="Selecione o permutante"
          />
          <pci-datepicker class="permuta-lado__data" label="Data" formControlName="dataVolta" [required]="true" />
        </div>
        <app-permuta-dias
          titulo="Escala do permutante"
          [ano]="lados.permutante().ano"
          [mes]="lados.permutante().mes"
          [escala]="lados.permutante().escala"
          [loading]="lados.permutante().loading"
          [semServidor]="!permutanteId()"
          [selecionada]="dataVolta()"
          (diaClicado)="onDia('permutante', $event)"
          (mesAlterado)="onMes('permutante', $event)"
        />
      </section>
    </div>

    <pci-textarea
      label="Observação"
      formControlName="observacao"
      placeholder="Informe alguma observação (opcional)..."
      [rows]="2"
    />
  </form>
</pci-form-page>
