<pci-form-page
  title="Copiar escala"
  description="Cria uma nova escala mensal em rascunho com jornadas recalculadas para o mês destino."
  [currentPath]="'/escalas/' + (origem()?.id ?? '') + '/copiar'"
  [routePages]="routePages"
  [loading]="saving()"
  (cancelClicked)="cancel()"
  (saveClicked)="save()"
>
  @if (error()) {
    <pci-alert variant="error" title="Erro" [message]="error()!" />
  }

  @if (origem(); as o) {
    <pci-alert variant="info" title="Origem" [message]="o.identificacao" />
  }

  <form [formGroup]="form">
    <app-form-section title="Mês de destino">
      <label [appFormCol]="6" class="pci-field">
        <span class="pci-field__label">Mês <span class="pci-field__required">*</span></span>
        <div class="pci-field__control pci-field__control--select">
          <mat-select
            class="pci-field__mat-select"
            formControlName="mes"
            panelClass="pci-select-panel"
            disableRipple
            hideSingleSelectionIndicator
          >
            @for (option of mesOptions; track option.value) {
              <mat-option [value]="+option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </div>
      </label>
      <pci-input [appFormCol]="6" label="Ano" formControlName="ano" type="number" [required]="true" />
    </app-form-section>
  </form>
</pci-form-page>
