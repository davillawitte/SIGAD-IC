<div class="pci-app-dialog">
  <app-dialog-header icon="calendar" title="Adicionar afastamento" (closed)="close()" />

  @if (error()) {
    <pci-alert variant="error" title="Erro" [message]="error()!" />
  }

  @if (created()) {
    <pci-alert variant="success" title="Afastamento cadastrado" message="Afastamento salvo com sucesso." />

    <pci-form-actions>
      <pci-button variant="primary" (clicked)="concluir()">
        <pci-icon slot="icon-left" name="check" size="sm" />
        Concluir
      </pci-button>
    </pci-form-actions>
  } @else {
  <pci-form-card>
    <form [formGroup]="form">
      <app-form-section title="Dados">
        <pci-select
          [appFormCol]="12"
          label="Servidor"
          [required]="true"
          formControlName="servidorId"
          [options]="data.servidorOptions"
          placeholder="Selecione o servidor"
        />

        <pci-input
          [appFormCol]="6"
          label="Data início"
          type="date"
          formControlName="dataInicio"
          [required]="true"
        />
        <pci-input
          [appFormCol]="6"
          label="Data fim"
          type="date"
          formControlName="dataFim"
          [required]="true"
        />

        <pci-select
          [appFormCol]="12"
          label="Tipo"
          [required]="true"
          formControlName="tipoOcorrenciaCodigo"
          [options]="tipoOptions"
          placeholder="Selecione o tipo"
        />

        <pci-input
          [appFormCol]="12"
          label="SEI"
          formControlName="sei"
          placeholder="Número do processo SEI (opcional)"
        />

        <pci-input [appFormCol]="12" label="Observação" formControlName="observacao" />
      </app-form-section>
    </form>
  </pci-form-card>

  <pci-form-actions>
    <pci-button variant="ghost" (clicked)="cancel()">Cancelar</pci-button>
    <pci-button variant="primary" [loading]="saving()" (clicked)="save()">
      <pci-icon slot="icon-left" name="check" size="sm" />
      Salvar
    </pci-button>
  </pci-form-actions>
  }
</div>
