<pci-form-page
  [title]="isEdit() ? 'Editar afastamento' : 'Novo afastamento'"
  description="Informe o período e o tipo de afastamento do servidor."
  [currentPath]="currentPath()"
  [routePages]="routePages"
  [loading]="saving()"
  (cancelClicked)="cancel()"
  (saveClicked)="save()"
>
  @if (error()) {
    <pci-alert variant="error" title="Erro" [message]="error()!" />
  }

  <form [formGroup]="form">
    <app-form-section title="Dados">
      <pci-select
        [appFormCol]="12"
        label="Servidor"
        [required]="true"
        formControlName="servidorId"
        [options]="servidorOptions()"
        placeholder="Selecione o servidor"
      />

      <pci-input label="Data início" type="date" formControlName="dataInicio" [required]="true" />
      <pci-input label="Data fim" type="date" formControlName="dataFim" [required]="true" />

      <pci-select
        [appFormCol]="12"
        label="Tipo"
        [required]="true"
        formControlName="tipoOcorrenciaCodigo"
        [options]="tipoOptions"
        placeholder="Selecione o tipo"
      />

      <pci-input [appFormCol]="12" label="SEI" formControlName="sei" placeholder="Número do processo SEI" />

      <pci-input [appFormCol]="12" label="Observação" formControlName="observacao" />
    </app-form-section>
  </form>
</pci-form-page>
