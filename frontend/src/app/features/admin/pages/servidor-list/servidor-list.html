@if (error()) {
  <pci-alert variant="error" title="Erro" [message]="error()!" />
}

<div class="servidores-list" [class.servidores-list--com-criar]="canCreate">
<!--
  pci-list-page não projeta ações extras no header (só o botão de criar) — mesmo arranjo da tela de
  Escalas: ações sobrepostas à área de ações do pci-page-header. Ver docs/design-system-pendencias.md.
-->
<div class="servidores-list__actions">
  <pci-tooltip text="Exportar servidores (PDF ou Excel)" position="bottom">
    <pci-icon-button
      pciTooltipChild
      icon="download"
      size="md"
      ariaLabel="Exportar servidores (PDF ou Excel)"
      [loading]="exportando()"
      [disabled]="allRows().length === 0"
      (clicked)="exportar()"
    />
  </pci-tooltip>
  @if (canCreate) {
    <pci-button variant="primary" icon="plus" (clicked)="goCreate()">Novo servidor</pci-button>
  }
</div>

<pci-list-page
  title="Servidores"
  description="Cadastro de servidores lotados nos setores do IC."
  currentPath="/servidores"
  [routePages]="routePages"
  [filterFields]="filterFields()"
  [filterValues]="filterValues()"
  [filtersExpanded]="filtersExpanded()"
  [columns]="columns"
  [rows]="pagedRows()"
  [total]="filteredRows().length"
  [page]="page()"
  [pageSize]="pageSize()"
  [loading]="loading()"
  [showCreateButton]="false"
  [rowActions]="rowActions()"
  sortMode="server"
  quickSearchMode="server"
  [sort]="sort()"
  (createClicked)="goCreate()"
  (filterApply)="onFilterApply($event)"
  (filterClear)="onFilterClear()"
  (filterValuesChange)="filterValues.set($event)"
  (filtersExpandedChange)="filtersExpanded.set($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)"
  (pageChange)="page.set($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (rowAction)="onRowAction($event)"
/>
</div>
