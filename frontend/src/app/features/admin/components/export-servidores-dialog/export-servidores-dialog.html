<div class="pci-app-dialog">
  <app-dialog-header icon="download" title="Exportar Listagem de Servidores" (closed)="cancel()" />
  <p class="export-servidores-dialog__subtitulo">Selecione as opções abaixo para gerar o arquivo.</p>

  <!-- Sem componente de radio no design system ainda: <input type="radio"> nativo, mesmo
       padrão do diálogo de exportar escala (shared/dialogs/export-escala-dialog). -->
  <div class="export-servidores-dialog__card">
    <div class="export-servidores-dialog__secao">
      <span class="export-servidores-dialog__icone"><pci-icon name="users" size="md" /></span>
      <div class="export-servidores-dialog__conteudo" role="radiogroup" aria-labelledby="exp-serv-quais">
        <h3 id="exp-serv-quais" class="export-servidores-dialog__titulo">Quais servidores?</h3>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-abrangencia"
            [checked]="abrangencia() === 'listagem'"
            (change)="abrangencia.set('listagem')"
          />
          <span>
            Listagem atual — {{ data.totalListagem }} {{ data.totalListagem === 1 ? 'servidor' : 'servidores' }}
            <small class="export-servidores-dialog__hint">(com os filtros e a busca aplicados)</small>
          </span>
        </label>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-abrangencia"
            [checked]="abrangencia() === 'todos'"
            (change)="abrangencia.set('todos')"
          />
          <span>Todos os servidores</span>
        </label>
      </div>
    </div>

    <div class="export-servidores-dialog__secao">
      <span class="export-servidores-dialog__icone"><pci-icon name="layers" size="md" /></span>
      <div class="export-servidores-dialog__conteudo" role="radiogroup" aria-labelledby="exp-serv-org">
        <h3 id="exp-serv-org" class="export-servidores-dialog__titulo">Organização</h3>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-organizacao"
            [checked]="!agruparPorSetor()"
            (change)="agruparPorSetor.set(false)"
          />
          <span>Lista única</span>
        </label>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-organizacao"
            [checked]="agruparPorSetor()"
            (change)="agruparPorSetor.set(true)"
          />
          <span>Separar por setor</span>
        </label>
      </div>
    </div>

    <div class="export-servidores-dialog__secao">
      <span class="export-servidores-dialog__icone"><pci-icon name="file" size="md" /></span>
      <div class="export-servidores-dialog__conteudo" role="radiogroup" aria-labelledby="exp-serv-formato">
        <h3 id="exp-serv-formato" class="export-servidores-dialog__titulo">Formato</h3>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-formato"
            [checked]="formato() === 'pdf'"
            (change)="formato.set('pdf')"
          />
          <span>PDF</span>
        </label>
        <label class="export-servidores-dialog__option">
          <input
            type="radio"
            name="export-servidores-formato"
            [checked]="formato() === 'excel'"
            (change)="formato.set('excel')"
          />
          <span>Excel</span>
        </label>
      </div>
    </div>
  </div>

  <div class="export-servidores-dialog__acoes">
    <pci-button variant="secondary" (clicked)="cancel()">Cancelar</pci-button>
    <pci-button variant="primary" (clicked)="confirm()">
      <pci-icon slot="icon-left" name="download" size="sm" />
      Exportar
    </pci-button>
  </div>
</div>
