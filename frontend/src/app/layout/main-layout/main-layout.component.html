<pci-app-layout

  brandLogoSrc="/assets/images/ic-icon.png"
  [navGroups]="navGroups()"
  [activeItemId]="activeItemId()"
  [userName]="userName()"
  [userMeta]="userMeta()"
  [userAvatarName]="userAvatarName()"
