<div class="pci-app-dialog">
  <app-dialog-header icon="edit" [title]="data.title" (closed)="cancel()" />
  @if (error()) {
    <pci-alert variant="error" title="Atenção" [message]="error()!" />
  }
  <pci-form-card>
    <form [formGroup]="form">
      <pci-textarea
        [label]="data.label"
        [placeholder]="data.placeholder || ''"
        [required]="true"
        [rows]="4"
        formControlName="value"
      />
    </form>
  </pci-form-card>
  <pci-form-actions>
    <pci-button variant="ghost" (clicked)="cancel()">{{ data.cancelLabel || 'Cancelar' }}</pci-button>
    <pci-button variant="primary" (clicked)="confirm()">
      <pci-icon slot="icon-left" name="check" size="sm" />
      {{ data.confirmLabel || 'Confirmar' }}
    </pci-button>
  </pci-form-actions>
</div>
