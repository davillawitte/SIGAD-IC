<div class="pci-app-dialog">
  <app-dialog-header icon="download" [title]="data.title || 'Exportar escala'" (closed)="cancel()" />
  <pci-form-card>
    <pci-stack gap="3" direction="vertical">
      <pci-stack gap="2" direction="vertical">
        <!-- Sem componente de radio no design system ainda (só existe markup nativo, usado
             internamente pelo próprio export-PDF da lib) — <input type="radio"> nativo aqui,
             seguindo o mesmo acento visual (--pci-color-primary). -->
        <label class="export-escala-dialog__option">
          <input
            type="radio"
            name="export-escala-formato"
            [checked]="formato() === 'pdf'"
            (change)="formato.set('pdf')"
          />
          PDF
        </label>
        <label class="export-escala-dialog__option">
          <input
            type="radio"
            name="export-escala-formato"
            [checked]="formato() === 'excel'"
            (change)="formato.set('excel')"
          />
          Excel
        </label>
      </pci-stack>

      @if (formato() === 'pdf') {
        <pci-stack gap="2" direction="vertical" class="export-escala-dialog__suboptions">
          <label class="export-escala-dialog__option">
            <input
              type="radio"
              name="export-escala-pdf-tipo"
              [checked]="pdfTipo() === 'definitiva'"
              (change)="pdfTipo.set('definitiva')"
            />
            Escala definitiva
          </label>
          <label class="export-escala-dialog__option">
            <input
              type="radio"
              name="export-escala-pdf-tipo"
              [disabled]="!data.temEscalaResumida"
              [checked]="pdfTipo() === 'resumida'"
              (change)="pdfTipo.set('resumida')"
            />
            Escala resumida
          </label>
          @if (!data.temEscalaResumida) {
            <p class="export-escala-dialog__hint">Esta escala não tem escala resumida vinculada.</p>
          }
        </pci-stack>
      } @else {
        <pci-stack gap="2" direction="vertical" class="export-escala-dialog__suboptions">
          <label class="export-escala-dialog__option">
            <input
              type="radio"
              name="export-escala-excel-opcao"
              [checked]="excelOpcao() === 'resumida'"
              (change)="excelOpcao.set('resumida')"
            />
            Resumida (auxílio-alimentação)
          </label>
          <label class="export-escala-dialog__option">
            <input
              type="radio"
              name="export-escala-excel-opcao"
              [checked]="excelOpcao() === 'completa'"
              (change)="excelOpcao.set('completa')"
            />
            Completa
          </label>
        </pci-stack>
      }
    </pci-stack>
  </pci-form-card>
  <pci-form-actions>
    <pci-button variant="ghost" (clicked)="cancel()">Cancelar</pci-button>
    <pci-button variant="primary" (clicked)="confirm()">
      <pci-icon slot="icon-left" name="download" size="sm" />
      Exportar
    </pci-button>
  </pci-form-actions>
</div>
